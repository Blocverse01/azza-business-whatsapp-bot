<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Account Statement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
    
        body {
          margin: 0;
          padding: 0;
          font-family: "Arial", sans-serif;
          position: relative;
          overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url(./images/bg.png);
            background-repeat: no-repeat;
            background-position: center;
            mix-blend-mode: multiply;
            overflow: hidden;
            z-index: -4;
        }
        
      </style>
  </head>
  <body>
   <div class="mt-[30px]">
       <!-- Account Statement Section -->
        {userDetails}
      
      <div class="w-auto mx-auto">
        <h2 class="text-lg font-semibold text-gray-900 py-[16px] mt-[20px]">
          Transaction History
        </h2>

        <div class="overflow-x-auto rounded-lg border border-gray-200">
          <table class="w-full text-left border-separate">
            <thead>
              <tr class="text-[12px] text-gray-500 bg-gray-50">
                <th class="px-4 py-2">Trans. Date</th>
                <th class="px-4 py-2">Type</th>
                <th class="px-4 py-2">Amount & Chain</th>
                <th class="px-4 py-2">Recipient</th>
                <th class="px-4 py-2">Reference</th>
              </tr>
            </thead>
            <tbody class="text-[12px] text-gray-800 [&>tr:nth-child(even)]:bg-gray-50">
              {transactionsRows}
            </tbody>
          </table>
        </div>
      </div>

         

      <div class="w-auto max-w-5xl mx-auto bg-gray-50 rounded-xl px-6 py-4 text-sm text-gray-600  mt-[20px] rounded-xl">
        <div>
          <div>
            <div class="flex justify-between items-center text-gray-600 text-sm">
              <span>©<span id="year"> {year} </span> USEAZZA LTD. <strong class="font-semibold">RC: 7810789.</strong></span>
              <span>All Rights Reserved.</span>
            </div>
          </div>
          <div class="text-gray-600 pt-[20px]">Contact us at <strong class="font-semibold">info.blocverse.com</strong></div>
        </div>
      </div>
      
   </div>
  </body>
</html>
