        background-position: center;
        background-repeat: no-repeat;

        content: "";

        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        height: 100%;
        overflow: hidden;
        mix-blend-mode: multiply;

        font-family: "Subjectivity", sans-serif;
      }

      .font-subjectivity-super {
        font-family: "Subjectivity-Super", sans-serif;
      }

      .font-subjectivity-medium {
