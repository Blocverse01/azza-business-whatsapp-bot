<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rates Receipt</title>
        <style>
            @font-face {
                font-family: 'Subjectivity';
                src: url(./fonts/Subjectivity.Extrabold.woff2) format('woff2');
                font-weight: 800;
                font-style: normal;
            }

            body {
                margin: 0;
                padding: 0;
                font-family: 'Arial', sans-serif;
                background-color: #3430e9;
                background-image: url(./images/pattern-bg1.png);
                color: #ffffff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
                height: 100%;
                width: 100%;
            }

            body::before {
                background-image: url(./images/pattern-bg1.png); /* Diamond pattern */
                background-size: cover;
                mix-blend-mode: overlay;
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                bottom: 0;
                right: 0;
                width: 100%;
                height: 100%;
            }

            .container {
                text-align: center;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 20px;
                box-sizing: border-box;
            }

            .logo {
                margin-bottom: 10px;
            }

            .header {
                font-family: 'Subjectivity', Arial, sans-serif;
                font-weight: 950;
                font-size: 72px;
                line-height: 88px;
                letter-spacing: -4%;
                text-align: center;
                vertical-align: center;
                text-transform: uppercase;
                margin-bottom: 10px;
                letter-spacing: -2.88px;
            }

            .date {
                background-color: #d4f4a3; /* Light green background */
                color: #000000;
                font-size: 20px;
                padding: 5px 15px;
                border-radius: 5px;
                display: inline-block;
                margin-bottom: 20px;
            }

            .rates-table {
                position: relative;
                width: 600px;
                height: 150px;
                margin: 0 auto;
            }

            .rates-table-background {
                position: absolute;
                top: 0;
                left: 0;
                width: 996px;
                height: 305px;
                z-index: 1;
            }

            .rates-table-content {
                position: relative;
                z-index: 2;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: space-around;
                align-items: center;
                padding: 20px;
                box-sizing: border-box;
            }

            .rate-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                flex: 1;
            }

            .currency {
                text-align: center;
                font-family: Subjectivity;
                font-size: 35.124px;
                font-style: normal;
                font-weight: 800;
                line-height: 46.832px; /* 133.333% */
                letter-spacing: -2.927px;
            }

            .buy-sell {
                font-size: 32px;
                margin: 5px 0;
                font-family: Subjectivity;
                font-size: 32px;
                font-style: normal;
                font-weight: 800;
                line-height: 48.748px; /* 152.338% */
                letter-spacing: -2px;
                text-transform: uppercase;
            }

            .buy-sell-label {
                color: #d4f4a3; /* Light green for "BUY" and "SELL" labels */
            }

            .buy-sell-value {
                color: #ffffff;
            }

            .footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                padding: 0 20px;
                position: absolute;
                bottom: 20px;
            }

            .branding {
                position: absolute;
                bottom: 20px;
                left: 20px;
                font-size: 16px;
                color: #ffffff;
            }

            .socials {
                display: flex;
                align-items: center;
                gap: 10px;
                justify-content: center;
                width: 427px;
            }

            .social-icon {
                width: 24px;
                height: 24px;
            }

            .social-handle {
                font-size: 16px;
                color: #ffffff;
            }

            .coin-left,
            .coin-right {
                position: absolute;
                width: 80px;
                height: 80px;
            }

            .coin-left {
                left: 20px;
                top: 50%;
                transform: translateY(-50%);
            }

            .coin-right {
                right: 20px;
                bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>
                <div class="logo">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="140"
                        height="48"
                        viewBox="0 0 140 48"
                        fill="none"
                    >
                        <path
                            d="M0 0.618652L138.011 0.618652L139.961 47.7656L128.16 45.6254L0 45.6254L0 0.618652Z"
                            fill="#D3FEB6"
                        />
                        <path
                            d="M112.449 12.1936L110.046 27.0221H114.934L112.449 12.1936ZM117.012 38.4286L116.523 35.2104H108.457L107.968 38.4286L95.584 38.4694L101.817 9.01611L123.123 9.01611L129.396 38.4286H117.012Z"
                            fill="#04150F"
                        />
                        <path
                            d="M71.0762 21.8892L90.1413 18.1413H71.4835V9.01611L95.4372 9.01611V25.5963L76.9831 29.3441H95.8446V38.4694H71.0762V21.8892Z"
                            fill="#04150F"
                        />
                        <path
                            d="M44.7783 21.8892L63.8435 18.1413H45.1857V9.01611L69.1394 9.01611V25.5963L50.6853 29.3441H69.5467V38.4694H44.7783V21.8892Z"
                            fill="#04150F"
                        />
                        <path
                            d="M28.0655 12.1936L25.662 27.0221H30.5505L28.0655 12.1936ZM32.6281 38.4286L32.1393 35.2104H24.0733L23.5844 38.4286L11.2002 38.4694L17.433 9.01611L38.7388 9.01611L45.0124 38.4286H32.6281Z"
                            fill="#04150F"
                        />
                    </svg>
                </div>
                <div class="header">AZZA RATES UPDATE</div>
                <div class="date">{{transactionDate}}</div>
            </div>
            <div class="rates-table">
                <div class="rates-table-background">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="996"
                        height="305"
                        viewBox="0 0 996 305"
                        fill="none"
                    >
                        <path
                            d="M5.03546 0H984.351L996 305L895.061 289.879H0L5.03546 0Z"
                            fill="#1E1E1E"
                        />
                    </svg>
                </div>
                <div class="rates-table-content">{{ratesHtml}}</div>
                <img src="./images/coin-left.png" class="coin-left" alt="Coin Left" />
            </div>
            <div class="footer">
                
                <div class="socials">
                    <img src="./images/instagram-icon.png" class="social-icon" alt="Instagram" />
                    <span class="social-handle">useazza</span>
                    <img src="./images/x-icon.png" class="social-icon" alt="X" />
                    <span class="social-handle">useazza</span>
                </div>
                <img src="./images/coin-right.png" class="coin-right" alt="Coin Right" />
            
        </div>
    </body>
</html>
